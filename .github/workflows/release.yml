name: Release Packages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-deb-rpm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux audio/GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libxkbcommon-dev libwayland-dev rpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm
      - name: Build release binary
        run: cargo build --release --locked
      - name: Build .deb
        run: cargo deb --no-build
      - name: Build .rpm
        run: cargo generate-rpm
      - name: Upload .deb and .rpm to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/debian/*.deb
            target/generate-rpm/*.rpm

  arch-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: pacman -Syu --noconfirm rust cargo alsa-lib git
      - name: Build release binary and Arch package
        run: |
          cargo build --release --locked
          useradd -m builder
          chown -R builder:builder .
          su builder -c "makepkg -f"
      - name: Upload .pkg.tar.zst to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.pkg.tar.zst"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Windows release
        run: cargo build --release --locked
      - name: Package Windows zip
        shell: pwsh
        run: Compress-Archive -Path target/release/fun-key-synth.exe -DestinationPath fun-key-synth-windows-x86_64.zip
      - name: Upload Windows binary and zip to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/fun-key-synth.exe
            fun-key-synth-windows-x86_64.zip
