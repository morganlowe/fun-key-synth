[package]
name = "fun-key-synth"
version = "1.2.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Fun Key Synth: a beginner-friendly analog vibe studio & 8-part performance sampler"

[lib]
name = "fun_key_synth"
path = "src/lib.rs"

[[bin]]
name = "fun-key-synth"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
midir = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm", "vorbis"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
