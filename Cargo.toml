[package]
name = "fun-key-synth"
version = "0.2.0"
edition = "2021"
description = "Fun Key Synth: a native Linux analog and lo-fi groovebox synthesizer"

[lib]
name = "fun_key_synth"
path = "src/lib.rs"

[[bin]]
name = "fun-key-synth"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
cpal = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hound = "3.5"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "pcm", "vorbis"] }
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
